[package]
name = "fate_core"
version = "0.1.0"
edition = "2021"
description = "Executive fate engine (Rust/WASM) — consumes compiler IR tapes, emits raw facts only (docs/design/engine-port-roadmap.md phase 1)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "fate_cli"
path = "src/bin/fate_cli.rs"

[dependencies]
libm = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
debug = false
