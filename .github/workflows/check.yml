name: check
on:
  push:
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 역사 — 지운 문서의 단위 장부는 고정 커밋(src_at)에서 읽고, 계획 기록은 git 역사와 대조한다 (STG-10a)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust 도구 사슬 (1단계 엔진 — 네이티브 = WASM 대조)
        run: |
          rustup toolchain install stable --profile minimal
          cd engine/rust && cargo test --release && cargo build --release --bin fate_cli
          # 커밋된 WASM 이 지금 소스로 빌드됐는지는 tests/rust_engine.test.mjs ① 이 소스 해시로 검사 (rustc 버전마다 WASM 바이트는 다를 수 있어 다시 빌드해 비교하지 않음)
      - name: 구역 점검 (Governor CI 겹 — 커밋이 선언한 모드의 쓰기 구역 밖 변경을 거부 · 선언 없음은 알리기만, PLAN-114)
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="${BASE_PR:-$BEFORE}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          fi
          # ① 기준(main)의 판정 코드로 — 이 커밋이 판정 코드를 약하게 고쳐도 속지 않는다 (DEC-0086 D2 · RULE-0549 · 공격 경로 N3)
          #    main 의 트리를 임시 폴더에 풀고, 이 저장소의 git 기록(GIT_DIR)에 대고 돌린다. 작업 트리는 건드리지 않는다
          HEAD_SHA=$(git rev-parse HEAD)
          if git cat-file -e origin/main:rebuild/ci-zone.mjs 2>/dev/null; then
            TRUSTED="$RUNNER_TEMP/trusted-main"; mkdir -p "$TRUSTED"
            git archive origin/main | tar -x -C "$TRUSTED"
            echo "기준 판정 코드: origin/main $(git rev-parse --short origin/main)"
            GIT_DIR="$PWD/.git" node "$TRUSTED/rebuild/ci-zone.mjs" "$BASE" "$HEAD_SHA"
          else
            echo "기준(main)에 판정 코드가 없음 — ① 건너뜀"
          fi
          # ② 이 커밋의 판정 코드로 — main 에 아직 없는 새 규칙까지
          node rebuild/ci-zone.mjs "$BASE" HEAD
      - name: 규칙 테스트
        run: node --test tests/*.test.mjs
      - name: 저장소 전체 검사
        run: node dbtool.mjs validate
      - run: node dbtool.mjs limitations --check
      - name: "증명 등록부 (사법부 도장: digest · 증거 sha256 · 재확인)"
        run: node dbtool.mjs attest
      - name: 미등록 한계 후보 0 (unmapped 포함)
        run: node dbtool.mjs limitations --detect
      - name: 추세 점검 (시간 축 — 합의 수신함으로, 미등록 Consensus_Gap 후보 0)
        run: node dbtool.mjs trend
      - name: 신뢰 지표 분포 (등급이 계산되는지 — 저장되지 않는지)
        run: node dbtool.mjs grade
      - name: Fate-Test (세포 운명 — 충실도·비가역성·분화 정지·다른 운명·질량)
        run: node tests/fate_suite.js --quick
      - name: Fate-Test (Rust 엔진)
        run: node tests/fate_suite.js --quick --engine rust
      - name: 재건 관리 파일 최신 (rebuild/status)
        run: node rebuild/status.mjs --check
      - name: 교과서 부록 최신·모든 파일 분류
        run: node dbtool.mjs textbook --check
      - name: index.html 이 viewer.html 과 같은지
        run: cmp index.html viewer.html
