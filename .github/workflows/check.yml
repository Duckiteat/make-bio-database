name: check
on:
  push:
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 역사 — 지운 문서의 단위 장부는 고정 커밋(src_at)에서 읽고, 계획 기록은 git 역사와 대조한다 (STG-10a)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust 도구 사슬 (1단계 엔진 — 네이티브 = WASM 대조)
        run: |
          rustup toolchain install stable --profile minimal
          cd engine/rust && cargo test --release && cargo build --release --bin fate_cli
          # 커밋된 WASM 이 지금 소스로 빌드됐는지는 tests/rust_engine.test.mjs ① 이 소스 해시로 검사 (rustc 버전마다 WASM 바이트는 다를 수 있어 다시 빌드해 비교하지 않음)
      - name: 규칙 테스트
        run: node --test tests/*.test.mjs
      - name: 저장소 전체 검사
        run: node dbtool.mjs validate
      - run: node dbtool.mjs limitations --check
      - name: "증명 등록부 (사법부 도장: digest · 증거 sha256 · 재확인)"
        run: node dbtool.mjs attest
      - name: 미등록 한계 후보 0 (unmapped 포함)
        run: node dbtool.mjs limitations --detect
      - name: 추세 점검 (시간 축 — 합의 수신함으로, 미등록 Consensus_Gap 후보 0)
        run: node dbtool.mjs trend
      - name: 신뢰 지표 분포 (등급이 계산되는지 — 저장되지 않는지)
        run: node dbtool.mjs grade
      - name: Fate-Test (세포 운명 — 충실도·비가역성·분화 정지·다른 운명·질량)
        run: node tests/fate_suite.js --quick
      - name: Fate-Test (Rust 엔진)
        run: node tests/fate_suite.js --quick --engine rust
      - name: 재건 관리 파일 최신 (rebuild/status)
        run: node rebuild/status.mjs --check
      - name: 교과서 부록 최신·모든 파일 분류
        run: node dbtool.mjs textbook --check
      - name: index.html 이 viewer.html 과 같은지
        run: cmp index.html viewer.html
