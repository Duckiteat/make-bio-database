name: check
on:
  push:
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 규칙 테스트
        run: node --test tests/*.test.mjs
      - name: 저장소 전체 검사
        run: node dbtool.mjs validate
      - run: node dbtool.mjs limitations --check
      - name: 미등록 한계 후보 0 (unmapped 포함)
        run: node dbtool.mjs limitations --detect
      - name: P3 종단 시험 (영역 10,000 단계 질량 보존)
        run: node tests/p3_end_to_end.js --every 2500
      - name: P4 종단 시험 (대리 모델 + OOD 대체, 10,000 단계 질량 보존)
        run: node tests/p4_end_to_end.js --every 5000
      - name: P5 동적 승격·강등 (10,000 단계, 질량·장 정합·충격 강등)
        run: node tests/p5_dynamic_promotion.js --every 5000
      - name: Fate-Test (세포 운명 — 충실도·비가역성·분화 정지·다른 운명·질량)
        run: node tests/fate_suite.js --quick
      - name: v8 인터페이스 — Python 자체 시험·C++ 구문
        run: |
          python3 engine/interfaces/hmse.py --selftest
          printf '#include "engine/interfaces/hmse.hpp"\nint main(){return 0;}\n' > /tmp/hmse_check.cpp
          g++ -std=c++20 -fsyntax-only -Wall -Wextra -I. /tmp/hmse_check.cpp
      - name: 교과서 부록 최신·모든 파일 분류
        run: node dbtool.mjs textbook --check
      - name: index.html 이 viewer.html 과 같은지
        run: cmp index.html viewer.html
